name: NextCue
options:
  bundleIdPrefix: com.jackwallner
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: "5.72.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YXG4MP6W39
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO

schemes:
  NextCue:
    build:
      targets:
        NextCue: all
        NextCueTests: [test]
        NextCueUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: NextCue.storekit
    test:
      config: Debug
      storeKitConfiguration: NextCue.storekit
      targets:
        - NextCueTests
        - NextCueUITests

targets:
  NextCue:
    type: application
    platform: iOS
    sources:
      - path: NextCue
        excludes:
          - Info.plist
          - PrivacyInfo.xcprivacy
          - "*.entitlements"
      - path: NextCue/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.adhd
        PRODUCT_NAME: NextCue
        INFOPLIST_FILE: NextCue/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) HAS_REVENUECAT"
    dependencies:
      - package: RevenueCat
        product: RevenueCat

  NextCueTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NextCueTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.adhd.tests
    dependencies:
      - target: NextCue

  NextCueUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NextCueUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.adhd.uitests
        TEST_TARGET_NAME: NextCue
    dependencies:
      - target: NextCue
